[project]
name = "vision-board-detector"
version = "0.1.0"
description = "Learning project for detecting the TFT board from screenshots."
requires-python = ">=3.9"

[tool.mypy]
python_version = "3.9"
strict = true
warn_unreachable = true
pretty = true
files = ["scripts", "src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

